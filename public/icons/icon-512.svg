<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7D19C"/>
      <stop offset="45%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#996D1E"/>
    </linearGradient>
    <radialGradient id="glow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E7D19C" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0F472A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A2F1C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#0A2F1C"/>
  <rect width="512" height="512" rx="112" fill="url(#glow512)"/>

  <!-- Outer Orbit Border -->
  <circle cx="256" cy="256" r="192" stroke="#C89B3C" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.35"/>
  <circle cx="256" cy="256" r="210" stroke="#E7D19C" stroke-width="1" opacity="0.15"/>

  <!-- Gold 8-Point Rub el Hizb Geometric Star Crest -->
  <g transform="translate(256, 256) scale(12.5)">
    <!-- Square 1 -->
    <rect x="-8.5" y="-8.5" width="17" height="17" rx="1.6" stroke="url(#goldGrad512)" stroke-width="1.3" fill="#0F472A" fill-opacity="0.75"/>
    <!-- Square 2 rotated 45 deg -->
    <rect x="-8.5" y="-8.5" width="17" height="17" rx="1.6" stroke="url(#goldGrad512)" stroke-width="1.3" fill="#0F472A" fill-opacity="0.75" transform="rotate(45)"/>
    
    <!-- Central Jewel / Star core -->
    <circle cx="0" cy="0" r="3.2" fill="url(#goldGrad512)"/>
    <circle cx="0" cy="0" r="1.5" fill="#0A2F1C"/>
    
    <!-- Accent Dots -->
    <circle cx="0" cy="-6" r="0.65" fill="#E7D19C"/>
    <circle cx="0" cy="6" r="0.65" fill="#E7D19C"/>
    <circle cx="-6" cy="0" r="0.65" fill="#E7D19C"/>
    <circle cx="6" cy="0" r="0.65" fill="#E7D19C"/>
  </g>
</svg>
